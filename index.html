const CATEGORIES = [

const CAT_COLORS = {

  "Preserving & Ferments":"#5E4A6E","From the Herb Box":"#3E6E4A",
  "Dry Goods & Pantry":"#6E5E3E",

function load() {
  try { const r = localStorage.getItem(STORAGE_KEY); if(r) return JSON.parse(r); } catch{}
  return null;
}
function save(recipes) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(recipes)); } catch{}
}

const D = () => (
  <div style={{display:"flex",alignItems:"center",gap:12,margin:"10px 0"}}>
    <div style={{flex:1,height:1,background:"linear-gradient(to right,transparent,#8B6914)"}}/>
    <span style={{color:"#8B6914",fontSize:13}}>✦</span>

const inputSt = {

};

/* ─── Recipe Card ─── */
function Card({r, onClick}) {

      <div style={{position:"absolute",top:9,right:11,fontSize:9,color:"#8B6914",fontFamily:"monospace",letterSpacing:"0.05em"}}>{r.cookMethod}</div>
      <div style={{fontSize:9,color,fontWeight:700,letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:5}}>{r.category}</div>

/* ─── Recipe Detail Sheet ─── */

  return (

      display:"flex",alignItems:"flex-end",justifyContent:"center",

/* ─── Add Recipe Sheet ─── */
function AddSheet({onClose, onAdd}) {
  const [step, setStep] = useState("choose");
  const [aiPrompt, setAiPrompt] = useState("");
  const [loading, setLoading] = useState(false);
  const [form, setForm] = useState({
    title:"",category:"Poultry",cookMethod:"Cast Iron Skillet",
    prepTime:"",cookTime:"",servings:"4",tags:"",
    story:"",ingredients:"",steps:"",notes:"",
  });
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  const generateAI = async () => {
    if(!aiPrompt.trim()) return;
    setLoading(true);
    try {
      const sys = `You write recipes for "Dirty Boots & Clean Eats" — hillbilly meets organic homesteader. The cook uses: Big Green Egg, cast iron, turkey fryer, Dutch ovens, rendered pork/chicken fat, garden herbs (rosemary, oregano, basil, chives), homegrown vegetables (tomatoes, cucumbers, beans, peppers), pond fish (catfish, bluegill, tilapia). He hates onions — never include them. Write plainspoken and gritty.

Return ONLY valid JSON, zero markdown or backticks:
{"title":"string","category":"Breads & Biscuits|Poultry|Pork|Wild Game|Fish & Pond|Garden Vegetables|Soups & Stews|Preserving & Ferments|From the Herb Box|Dry Goods & Pantry","cookMethod":"Cast Iron Skillet|Big Green Egg|Turkey Fryer|Dutch Oven|Open Fire|Stovetop|Oven|Smoker","prepTime":"string","cookTime":"string","servings":4,"tags":["tag"],"story":"1-2 sentences","ingredients":["item"],"steps":["step"],"notes":"tip"}`;
      const res = await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-20250514", max_tokens:1000,
          system:sys,
          messages:[{role:"user",content:aiPrompt}],
        }),
      });
      const j = await res.json();
      const text = j.content?.find(b=>b.type==="text")?.text||"";
      const parsed = JSON.parse(text.replace(/```json|```/g,"").trim());
      onAdd({...parsed, id:Date.now(), addedDate:new Date().toISOString().slice(0,10)});
    } catch(e) {
      alert("Something went wrong. Try again or enter manually.");
      console.error(e);
    } finally { setLoading(false); }
  };

  const submitManual = () => {
    if(!form.title||!form.ingredients||!form.steps) return;
    onAdd({
      id:Date.now(), title:form.title, category:form.category, cookMethod:form.cookMethod,
      prepTime:form.prepTime, cookTime:form.cookTime, servings:parseInt(form.servings)||4,
      tags:form.tags.split(",").map(t=>t.trim()).filter(Boolean),
      story:form.story,
      ingredients:form.ingredients.split("\n").map(s=>s.trim()).filter(Boolean),
      steps:form.steps.split("\n").map(s=>s.trim()).filter(Boolean),
      notes:form.notes, addedDate:new Date().toISOString().slice(0,10),
    });
  };

  return (
    <div onClick={e=>{if(e.target===e.currentTarget)onClose();}} style={{
      position:"fixed",inset:0,background:"rgba(12,6,0,0.88)",zIndex:1000,
      display:"flex",alignItems:"flex-end",justifyContent:"center",
      backdropFilter:"blur(4px)",WebkitBackdropFilter:"blur(4px)",
    }}>
      <div style={{
        background:"linear-gradient(160deg,#FFFAEE,#FFF5D8)",
        border:"2px solid #D4A843",borderRadius:"16px 16px 0 0",
        width:"100%",maxWidth:680,maxHeight:"92vh",overflowY:"auto",
        padding:"28px 20px",fontFamily:"'Lora',Georgia,serif",
        paddingBottom:"calc(28px + env(safe-area-inset-bottom))",
      }}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
          <div>
            <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:22,color:"#2C1810"}}>Add a Recipe</h2>
            <p style={{fontSize:12,color:"#8B6914",marginTop:2}}>Tell me what you cooked, or fill it in yourself.</p>
          </div>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:28,cursor:"pointer",color:"#8B6914"}}>×</button>
        </div>

        {step==="choose" && (
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            <button onClick={()=>setStep("ai")} style={{background:"linear-gradient(135deg,#3E6B1A,#5C8A2E)",color:"#fff",border:"none",borderRadius:6,padding:"16px 18px",fontFamily:"'Lora',serif",cursor:"pointer",textAlign:"left"}}>
              <div style={{fontWeight:700,fontSize:15,marginBottom:3}}>🤖 Describe it — I'll write it up</div>
              <div style={{fontSize:12,opacity:0.9}}>Tell me what you cooked and I'll build the full card</div>
            </button>
            <button onClick={()=>setStep("manual")} style={{background:"transparent",color:"#6B3A10",border:"2px solid #D4A843",borderRadius:6,padding:"16px 18px",fontFamily:"'Lora',serif",cursor:"pointer",textAlign:"left"}}>
              <div style={{fontWeight:700,fontSize:15,marginBottom:3}}>✍️ I'll fill it in myself</div>
              <div style={{fontSize:12,opacity:0.8}}>Enter the details manually</div>
            </button>
          </div>
        )}

        {step==="ai" && (
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {lbl("Describe what you cooked")}
            <textarea value={aiPrompt} onChange={e=>setAiPrompt(e.target.value)} rows={5}
              placeholder={`e.g. "Smoked bluegill from the pond, seasoned with garden rosemary and oregano, cooked on the Big Green Egg over pecan wood."`}
              style={{...inputSt,resize:"vertical"}}
            />
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setStep("choose")} style={{padding:"10px 14px",background:"transparent",border:"1px solid #D4A843",borderRadius:3,cursor:"pointer",fontFamily:"'Lora',serif",color:"#6B3A10"}}>← Back</button>
              <button onClick={generateAI} disabled={loading||!aiPrompt.trim()} style={{flex:1,padding:12,fontFamily:"'Lora',serif",fontSize:14,background:loading?"#ccc":"linear-gradient(135deg,#3E6B1A,#5C8A2E)",color:"#fff",border:"none",borderRadius:4,cursor:loading?"wait":"pointer"}}>
                {loading?"Writing your recipe…":"Generate Recipe ✦"}
              </button>
            </div>
          </div>
        )}

        {step==="manual" && (
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            <div>{lbl("Recipe Title")}<input value={form.title} onChange={e=>set("title",e.target.value)} style={inputSt} placeholder="Cast Iron Pond Catfish"/></div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <div>{lbl("Category")}<select value={form.category} onChange={e=>set("category",e.target.value)} style={inputSt}>{CATEGORIES.filter(c=>c!=="All").map(c=><option key={c}>{c}</option>)}</select></div>
              <div>{lbl("Cook Method")}<select value={form.cookMethod} onChange={e=>set("cookMethod",e.target.value)} style={inputSt}>{COOK_METHODS.map(m=><option key={m}>{m}</option>)}</select></div>
              <div>{lbl("Prep Time")}<input value={form.prepTime} onChange={e=>set("prepTime",e.target.value)} style={inputSt} placeholder="15 min"/></div>
              <div>{lbl("Cook Time")}<input value={form.cookTime} onChange={e=>set("cookTime",e.target.value)} style={inputSt} placeholder="45 min"/></div>
            </div>
            <div>{lbl("Tags (comma-separated)")}<input value={form.tags} onChange={e=>set("tags",e.target.value)} style={inputSt} placeholder="cast iron, smoke, garden herbs"/></div>
            <div>{lbl("The Story")}<textarea value={form.story} onChange={e=>set("story",e.target.value)} rows={2} style={{...inputSt,resize:"vertical"}}/></div>
            <div>{lbl("Ingredients (one per line)")}<textarea value={form.ingredients} onChange={e=>set("ingredients",e.target.value)} rows={5} style={{...inputSt,resize:"vertical"}}/></div>
            <div>{lbl("Steps (one per line)")}<textarea value={form.steps} onChange={e=>set("steps",e.target.value)} rows={5} style={{...inputSt,resize:"vertical"}}/></div>
            <div>{lbl("Notes (optional)")}<textarea value={form.notes} onChange={e=>set("notes",e.target.value)} rows={2} style={{...inputSt,resize:"vertical"}}/></div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setStep("choose")} style={{padding:"10px 14px",background:"transparent",border:"1px solid #D4A843",borderRadius:3,cursor:"pointer",fontFamily:"'Lora',serif",color:"#6B3A10"}}>← Back</button>
              <button onClick={submitManual} disabled={!form.title} style={{flex:1,padding:12,fontFamily:"'Lora',serif",fontSize:14,background:!form.title?"#ccc":"linear-gradient(135deg,#8B4513,#A0522D)",color:"#fff",border:"none",borderRadius:4,cursor:"pointer"}}>Add to Cookbook ✦</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ─── Backup / Restore Sheet ─── */
function BackupSheet({recipes, onImport, onClose}) {
  const fileRef = React.useRef();

  const doExport = () => {
    const data = JSON.stringify({version:1, exportedAt:new Date().toISOString(), recipes}, null, 2);
    const blob = new Blob([data], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "dirty-boots-backup-" + new Date().toISOString().slice(0,10) + ".json";
    a.click();
    URL.revokeObjectURL(url);
  };

  const doImport = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        const imported = parsed.recipes || parsed;
        if(!Array.isArray(imported)) throw new Error("Bad format");
        onImport(imported);
      } catch {
        alert("Couldn't read that file. Make sure it's a Dirty Boots backup.");
      }
    };
    reader.readAsText(file);
  };

  return (
    <div onClick={e=>{if(e.target===e.currentTarget)onClose();}} style={{
      position:"fixed",inset:0,background:"rgba(12,6,0,0.88)",zIndex:1000,
      display:"flex",alignItems:"flex-end",justifyContent:"center",
      backdropFilter:"blur(4px)",WebkitBackdropFilter:"blur(4px)",
    }}>
      <div style={{
        background:"linear-gradient(160deg,#FFFAEE,#FFF5D8)",
        border:"2px solid #D4A843",borderRadius:"16px 16px 0 0",
        width:"100%",maxWidth:680,
        padding:"28px 20px",fontFamily:"'Lora',Georgia,serif",
        paddingBottom:"calc(28px + env(safe-area-inset-bottom))",
      }}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
          <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:22,color:"#2C1810"}}>Backup & Restore</h2>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:28,cursor:"pointer",color:"#8B6914"}}>x</button>
        </div>
        <p style={{fontSize:12,color:"#8B6914",marginBottom:20,fontStyle:"italic"}}>Export your recipes before updating the app, then import them back in.</p>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <button onClick={doExport} style={{
            background:"linear-gradient(135deg,#3E6B1A,#5C8A2E)",color:"#fff",

            <div style={{fontSize:10,color:"#8B6914",letterSpacing:"0.1em",marginBottom:6}}>HOW TO UPDATE THE APP</div>

            </ol>

    body: [
      {
        heading: "What You've Got",
        text: "This is a King Midas Hone made by King Razor Mfg. Co. out of Indiana, Pennsylvania — early 1900s, made for barbers to keep straight razors shaving sharp. Your grandfather carried this. It's a fine-grit finishing stone, not a coarse grinder. It won't hog off metal — it polishes an edge to razor sharp. That's exactly what you want for kitchen knives, fillet knives, and pocket blades.",
      },
      {
        heading: "Before You Start",
        text: "Wet the surface with a few drops of water or a light oil — honing oil, mineral oil, or even a drop of tallow works fine. Just enough to float the swarf (the metal dust) off the stone so it doesn't load up and glaze over. Don't drown it. A shiny wet surface is all you need.",
      },
      {
        heading: "The Angle",
        text: "For most knives, hold the blade at 15–20 degrees off the stone. A simple way to find it: lay the blade flat, then raise the spine until a matchbook would just fit underneath. That's your angle. Hold it there the whole time — consistency matters more than anything else.",
      },
      {
        heading: "The Stroke",
        text: "Edge leading. Push the blade forward like you're trying to shave a thin layer off the top of the stone, heel to tip in one smooth arc. Light, even pressure. When you pull it back, flip it over and do the other side. Match your stroke count — five on one side, five on the other. As the edge comes up, lighten the pressure. The last few strokes should be barely touching.",
      },
      {
        heading: "How to Know It's Sharp",
        text: "Drag the edge lightly across your thumbnail at an angle. A sharp blade catches and stops — a dull one slides right off. Or hold it up to light: a sharp edge disappears, it reflects nothing. A dull edge shows a bright line where it's rolled or flat.",
      },
      {
        heading: "Caring for the Stone",
        text: "After every use, rinse it off and dry it. If it starts to look glazed or slick — loading up with metal — scrub it with a little coarse cleanser or a damp brick. Store it dry. This stone has lasted over a hundred years already. Treat it right and it'll outlast everything else in your kitchen.",
      },
    ],
    addedDate: "2026-05-17",
    source: "Grandpa's stone + King Razor Mfg. Co. history, Indiana, PA",
  },
];


/* ─── Old Ways Card ─── */
function OldWaysCard({entry, onClick}) {
  return (
    <div onClick={()=>onClick(entry)} style={{
      background:"linear-gradient(145deg,#FFF8E8,#FFF3D6)",
      border:"1px solid #D4A843", borderLeft:"5px solid #7A3E1A",
      borderRadius:4, padding:"16px 14px", cursor:"pointer",
      fontFamily:"'Lora',Georgia,serif",
      boxShadow:"2px 2px 8px rgba(0,0,0,0.1)",
    }}>
      <div style={{fontSize:9,color:"#7A3E1A",fontWeight:700,letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:5}}>The Old Ways</div>
      <div style={{fontSize:17,fontWeight:700,color:"#2C1810",lineHeight:1.2,marginBottom:4,fontFamily:"'Playfair Display',serif"}}>{entry.title}</div>
      <div style={{fontSize:11,color:"#8B6914",fontStyle:"italic",marginBottom:9}}>{entry.subtitle}</div>
      {entry.photo && (
        <img src={"data:image/jpeg;base64,"+entry.photo} alt={entry.title}
          style={{width:"100%",height:120,objectFit:"cover",borderRadius:3,marginBottom:9,border:"1px solid #D4A843"}}/>
      )}
      <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:8}}>
        {(entry.tags||[]).map(t=>(
          <span key={t} style={{background:"rgba(122,62,26,0.1)",border:"1px solid rgba(122,62,26,0.3)",borderRadius:3,padding:"2px 6px",fontSize:9,color:"#7A3E1A",fontFamily:"monospace"}}>{t}</span>
        ))}
      </div>
      <div style={{fontSize:12,color:"#5C4A2E",fontStyle:"italic",lineHeight:1.5}}>{entry.body[0].text.slice(0,90)}…</div>
    </div>
  );
}

/* ─── Old Ways Detail ─── */
function OldWaysDetail({entry, onClose}) {
  if(!entry) return null;
  return (
    <div onClick={e=>{if(e.target===e.currentTarget)onClose();}} style={{
      position:"fixed",inset:0,background:"rgba(12,6,0,0.88)",zIndex:1000,
      display:"flex",alignItems:"flex-end",justifyContent:"center",
      backdropFilter:"blur(4px)",WebkitBackdropFilter:"blur(4px)",
    }}>
      <div style={{
        background:"linear-gradient(160deg,#FFFAEE,#FFF5D8)",
        border:"2px solid #D4A843",borderRadius:"16px 16px 0 0",
        width:"100%",maxWidth:680,maxHeight:"92vh",overflowY:"auto",
        padding:"28px 20px 48px",fontFamily:"'Lora',Georgia,serif",
        paddingBottom:"calc(48px + env(safe-area-inset-bottom))",
      }}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
          <div>
            <div style={{fontSize:9,color:"#7A3E1A",letterSpacing:"0.15em",textTransform:"uppercase",marginBottom:4}}>The Old Ways</div>
            <h2 style={{fontSize:22,color:"#2C1810",lineHeight:1.2,fontFamily:"'Playfair Display',serif"}}>{entry.title}</h2>
            <div style={{fontSize:11,color:"#8B6914",marginTop:4,fontStyle:"italic"}}>{entry.subtitle}</div>
          </div>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:28,cursor:"pointer",color:"#8B6914",padding:"0 0 0 12px"}}>×</button>
        </div>

        {entry.photo && (
          <div style={{margin:"16px 0"}}>
            <img src={"data:image/jpeg;base64,"+entry.photo} alt={entry.title}
              style={{width:"100%",borderRadius:6,border:"2px solid #D4A843",display:"block"}}/>
            {entry.photoCaption && (
              <div style={{fontSize:11,color:"#8B6914",fontStyle:"italic",textAlign:"center",marginTop:6}}>{entry.photoCaption}</div>
            )}
          </div>
        )}

        {entry.body.map((section,i) => (
          <div key={i} style={{marginBottom:18}}>
            <div style={{
              fontSize:11,color:"#7A3E1A",letterSpacing:"0.1em",textTransform:"uppercase",
              marginBottom:6,fontWeight:700,borderLeft:"3px solid #7A3E1A",paddingLeft:8,
            }}>{section.heading}</div>
            <p style={{color:"#3C2810",fontSize:14,lineHeight:1.85,margin:0}}>{section.text}</p>
          </div>
        ))}

        {entry.source && (
          <div style={{background:"rgba(139,105,20,0.08)",border:"1px dashed #D4A843",borderRadius:4,padding:"10px 14px",marginTop:8}}>
            <div style={{fontSize:10,color:"#8B6914",letterSpacing:"0.1em",marginBottom:3}}>SOURCE</div>
            <p style={{color:"#6B5030",fontSize:12,margin:0,fontStyle:"italic"}}>{entry.source}</p>
          </div>
        )}
        <div style={{marginTop:16,fontSize:10,color:"#AAA",textAlign:"right",fontFamily:"monospace"}}>Added {entry.addedDate}</div>
      </div>
    </div>
  );
}


/* ─── Next Cook Card ─── */
function NextCookCard({entry, onClick}) {
  return (
    <div onClick={()=>onClick(entry)} style={{
      background:"linear-gradient(145deg,#F0F8FF,#E8F4F0)",
      border:"1px solid #4A7A6A", borderLeft:"5px solid #2E6B5A",
      borderRadius:4, padding:"16px 14px", cursor:"pointer",
      fontFamily:"'Lora',Georgia,serif",
      boxShadow:"2px 2px 8px rgba(0,0,0,0.1)",
    }}>
      <div style={{fontSize:9,color:"#2E6B5A",fontWeight:700,letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:5}}>Next Cook</div>
      <div style={{fontSize:17,fontWeight:700,color:"#1A3028",lineHeight:1.2,marginBottom:6,fontFamily:"'Playfair Display',serif"}}>{entry.title}</div>
      {entry.photo && (
        <img src={"data:image/jpeg;base64,"+entry.photo} alt={entry.title}
          style={{width:"100%",height:140,objectFit:"cover",borderRadius:3,marginBottom:9,border:"1px solid #4A7A6A"}}/>
      )}
      <div style={{fontSize:12,color:"#2C4A3A",fontStyle:"italic",lineHeight:1.6,marginBottom:8}}>{entry.notes}</div>
      <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
        {(entry.tags||[]).map(t=>(
          <span key={t} style={{background:"rgba(46,107,90,0.1)",border:"1px solid rgba(46,107,90,0.3)",borderRadius:3,padding:"2px 6px",fontSize:9,color:"#2E6B5A",fontFamily:"monospace"}}>{t}</span>
        ))}
      </div>
    </div>
  );
}

/* ─── Next Cook Detail ─── */
function NextCookDetail({entry, onClose, onMoveToBook}) {
  if(!entry) return null;
  return (
    <div onClick={e=>{if(e.target===e.currentTarget)onClose();}} style={{
      position:"fixed",inset:0,background:"rgba(12,6,0,0.88)",zIndex:1000,
      display:"flex",alignItems:"flex-end",justifyContent:"center",
      backdropFilter:"blur(4px)",WebkitBackdropFilter:"blur(4px)",
    }}>
      <div style={{
        background:"linear-gradient(160deg,#F0FFF8,#E8F5EE)",
        border:"2px solid #4A7A6A",borderRadius:"16px 16px 0 0",
        width:"100%",maxWidth:680,maxHeight:"92vh",overflowY:"auto",
        padding:"28px 20px 48px",fontFamily:"'Lora',Georgia,serif",
        paddingBottom:"calc(48px + env(safe-area-inset-bottom))",
      }}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
          <div>
            <div style={{fontSize:9,color:"#2E6B5A",letterSpacing:"0.15em",textTransform:"uppercase",marginBottom:4}}>Next Cook</div>
            <h2 style={{fontSize:22,color:"#1A3028",lineHeight:1.2,fontFamily:"'Playfair Display',serif"}}>{entry.title}</h2>
            {entry.source && <div style={{fontSize:11,color:"#4A7A6A",marginTop:4,fontStyle:"italic"}}>Source: {entry.source}</div>}
          </div>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:28,cursor:"pointer",color:"#4A7A6A",padding:"0 0 0 12px"}}>×</button>
        </div>

        {entry.photo && (
          <img src={"data:image/jpeg;base64,"+entry.photo} alt={entry.title}
            style={{width:"100%",borderRadius:6,border:"2px solid #4A7A6A",display:"block",marginBottom:16}}/>
        )}

        <p style={{fontSize:14,color:"#2C4A3A",lineHeight:1.8,fontStyle:"italic",marginBottom:16}}>{entry.notes}</p>

        {entry.ingredients && entry.ingredients.length > 0 && <>
          <div style={{fontSize:11,color:"#2E6B5A",letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:8,fontWeight:700}}>What You'll Need</div>
          <ul style={{paddingLeft:18,marginBottom:16}}>
            {entry.ingredients.map((x,i)=><li key={i} style={{color:"#1A3028",fontSize:14,lineHeight:1.9}}>{x}</li>)}
          </ul>
        </>}

        <button onClick={()=>onMoveToBook(entry)} style={{
          width:"100%",padding:"14px",
          background:"linear-gradient(135deg,#8B4513,#A0522D)",
          color:"#F5D78E",border:"none",borderRadius:6,
          fontFamily:"'Lora',serif",fontSize:15,cursor:"pointer",
          marginTop:8,
        }}>
          ✦ Made It — Move to Cookbook
        </button>
        <div style={{marginTop:16,fontSize:10,color:"#888",textAlign:"right",fontFamily:"monospace"}}>Added {entry.addedDate}</div>
      </div>
    </div>
  );
}

/* ─── Main App with Nav ─── */
function App() {
  const [recipes, setRecipes] = useState([]);
  const [nextCooks, setNextCooks] = useState(NEXT_COOK_ENTRIES);
  const [section, setSection] = useState("cookbook");
  const [selected, setSelected] = useState(null);
  const [selectedOW, setSelectedOW] = useState(null);
  const [selectedNC, setSelectedNC] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [showBackup, setShowBackup] = useState(false);
  const [cat, setCat] = useState("All");
  const [q, setQ] = useState("");
  const [toast, setToast] = useState(null);

  useEffect(()=>{
    const saved = load();
    setRecipes(saved || INITIAL_RECIPES);
    if(!saved) save(INITIAL_RECIPES);
  },[]);

  const addRecipe = (r) => {
    const updated = [...recipes, r];
    setRecipes(updated);
    save(updated);
    setShowAdd(false);
    setToast('"' + r.title + '" added!');
    setTimeout(()=>setToast(null),3000);
  };

  const handleImport = (imported) => {
    const existingIds = new Set(recipes.map(r=>r.id));
    const newOnes = imported.filter(r=>!existingIds.has(r.id));
    const merged = [...recipes, ...newOnes];
    setRecipes(merged);
    save(merged);
    setShowBackup(false);
    setToast("Imported " + newOnes.length + " recipe" + (newOnes.length!==1?"s":"") + "!");
    setTimeout(()=>setToast(null),3000);
  };

  const handleMoveToBook = (entry) => {
    // Remove from Next Cook, open Add sheet pre-filled
    setNextCooks(prev => prev.filter(e=>e.id!==entry.id));
    setSelectedNC(null);
    setSection("cookbook");
    setShowAdd(true);
    setToast("Fill in how it turned out!");
    setTimeout(()=>setToast(null),3000);
  };

  const filtered = recipes.filter(r => {
    const catOk = cat==="All" || r.category===cat;
    const qLow = q.toLowerCase();
    const matchOk = !q || r.title.toLowerCase().includes(qLow) || (r.tags||[]).some(t=>t.toLowerCase().includes(qLow));
    return catOk && matchOk;
  });

  const navBtn = (id, label, icon) => (
    <button onClick={()=>{setSection(id);setSelected(null);setSelectedOW(null);setSelectedNC(null);}} style={{
      flex:1, padding:"10px 4px", background:"none",
      border:"none", borderBottom: section===id ? "2px solid #D4A843" : "2px solid transparent",
      color: section===id ? "#F5D78E" : "#6B5030",
      fontFamily:"'Lora',serif", fontSize:10, cursor:"pointer",
      display:"flex", flexDirection:"column", alignItems:"center", gap:3,
      transition:"all 0.15s",
    }}>
      <span style={{fontSize:18}}>{icon}</span>
      <span style={{letterSpacing:"0.04em"}}>{label}</span>
    </button>
  );

  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(160deg,#1A0F00,#2C1A06 50%,#1A0F00)",fontFamily:"'Lora',Georgia,serif",paddingBottom:80}}>

      {toast && (
        <div style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",background:"#3E6B1A",color:"#fff",padding:"11px 18px",borderRadius:6,fontSize:13,zIndex:2000,boxShadow:"0 4px 20px rgba(0,0,0,0.4)",whiteSpace:"nowrap"}}>
          {toast}
        </div>
      )}

      {/* Header */}
      <div style={{textAlign:"center",padding:"40px 20px 24px",borderBottom:"1px solid rgba(212,168,67,0.3)"}}>
        <div style={{fontSize:9,color:"#8B6914",letterSpacing:"0.25em",marginBottom:10}}>A LIVING HOMESTEAD ALMANAC</div>
        <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:"clamp(28px,8vw,56px)",color:"#F5D78E",lineHeight:1.05,margin:"0 0 6px",textShadow:"0 2px 20px rgba(212,168,67,0.25)"}}>
          Dirty Boots<br />&amp; Clean Eats
        </h1>
        <p style={{color:"#A08040",fontSize:13,fontStyle:"italic",margin:"8px 0 16px"}}>Hillbilly meets organic — cooked hard, eaten right</p>
        {section==="cookbook" && (
          <div style={{display:"flex",gap:8,justifyContent:"center",flexWrap:"wrap"}}>
            <button onClick={()=>setShowAdd(true)} style={{background:"linear-gradient(135deg,#8B4513,#A0522D)",color:"#F5D78E",border:"none",borderRadius:4,padding:"10px 22px",fontSize:13,fontFamily:"'Lora',serif",cursor:"pointer",boxShadow:"0 4px 16px rgba(139,69,19,0.4)"}}>+ Add Recipe</button>
            <button onClick={()=>setShowBackup(true)} style={{background:"transparent",color:"#A08040",border:"1px solid rgba(212,168,67,0.4)",borderRadius:4,padding:"10px 14px",fontSize:12,fontFamily:"'Lora',serif",cursor:"pointer"}}>Backup</button>
          </div>
        )}
      </div>

      {/* Cookbook */}
      {section==="cookbook" && <>
        <div style={{padding:"14px 14px 12px",borderBottom:"1px solid rgba(212,168,67,0.2)"}}>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search recipes or tags..."
            style={{width:"100%",padding:"9px 13px",marginBottom:10,background:"rgba(255,255,255,0.06)",border:"1px solid rgba(212,168,67,0.4)",borderRadius:3,color:"#F5D78E",fontSize:13,fontFamily:"'Lora',serif",outline:"none"}}
          />
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            {CATEGORIES.map(c=>(
              <button key={c} onClick={()=>setCat(c)} style={{
                padding:"4px 10px",border:"1px solid "+(cat===c?"#D4A843":"rgba(212,168,67,0.3)"),
                background:cat===c?"rgba(212,168,67,0.15)":"transparent",
                color:cat===c?"#F5D78E":"#A08040",borderRadius:3,fontSize:10,
                cursor:"pointer",fontFamily:"'Lora',serif",
              }}>{c}</button>
            ))}
          </div>
        </div>
        <div style={{padding:"10px 14px 4px",color:"#6B5030",fontSize:11,fontStyle:"italic"}}>
          {filtered.length} recipe{filtered.length!==1?"s":""}{cat!=="All"?" in "+cat:""}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(290px,1fr))",gap:14,padding:"14px"}}>
          {filtered.map(r=><Card key={r.id} r={r} onClick={setSelected}/>)}
          {filtered.length===0 && (
            <div style={{gridColumn:"1/-1",textAlign:"center",padding:"60px 20px",color:"#6B5030",fontStyle:"italic",fontSize:16}}>Nothing here yet. Go cook something.</div>
          )}
        </div>
      </>}

      {/* Old Ways */}
      {section==="oldways" && <>
        <div style={{padding:"20px 14px 8px"}}>
          <div style={{fontSize:9,color:"#7A3E1A",letterSpacing:"0.2em",marginBottom:6}}>THE OLD WAYS</div>
          <p style={{color:"#A08040",fontSize:13,fontStyle:"italic",lineHeight:1.6}}>How things were done before everything got convenient. Written down so it doesn't disappear.</p>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(290px,1fr))",gap:14,padding:"10px 14px"}}>
          {OLD_WAYS_ENTRIES.map(e=><OldWaysCard key={e.id} entry={e} onClick={setSelectedOW}/>)}
        </div>
      </>}

      {/* Next Cook */}
      {section==="nextcook" && <>
        <div style={{padding:"20px 14px 8px"}}>
          <div style={{fontSize:9,color:"#2E6B5A",letterSpacing:"0.2em",marginBottom:6}}>NEXT COOK</div>
          <p style={{color:"#A08040",fontSize:13,fontStyle:"italic",lineHeight:1.6}}>Things worth trying. When you make it, move it to the cookbook.</p>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(290px,1fr))",gap:14,padding:"10px 14px"}}>
          {nextCooks.map(e=><NextCookCard key={e.id} entry={e} onClick={setSelectedNC}/>)}
          {nextCooks.length===0 && (
            <div style={{gridColumn:"1/-1",textAlign:"center",padding:"60px 20px",color:"#6B5030",fontStyle:"italic",fontSize:16}}>Nothing on the list. Add something that caught your eye.</div>
          )}
        </div>
      </>}

      {/* Bottom Nav */}
      <div style={{
        position:"fixed",bottom:0,left:0,right:0,
        background:"rgba(20,10,0,0.97)",
        borderTop:"1px solid rgba(212,168,67,0.3)",
        display:"flex",
        paddingBottom:"env(safe-area-inset-bottom)",
        zIndex:100,
      }}>
        {navBtn("cookbook","Cookbook","🍳")}
        {navBtn("oldways","Old Ways","📖")}
        {navBtn("nextcook","Next Cook","🔥")}
      </div>

      {selected && <Detail r={selected} onClose={()=>setSelected(null)}/>}
      {selectedOW && <OldWaysDetail entry={selectedOW} onClose={()=>setSelectedOW(null)}/>}
      {selectedNC && <NextCookDetail entry={selectedNC} onClose={()=>setSelectedNC(null)} onMoveToBook={handleMoveToBook}/>}
      {showAdd && <AddSheet onClose={()=>setShowAdd(false)} onAdd={addRecipe}/>}
      {showBackup && <BackupSheet recipes={recipes} onImport={handleImport} onClose={()=>setShowBackup(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
